services:
  web:
    cgroup_parent: reconstructor.slice
    build: .
    command: gunicorn reactions_project.wsgi:application --config /app/gunicorn.conf.py
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      matlab:
        condition: service_started
    extra_hosts:
      - "matlab:host-gateway"
    environment:
      - MATLAB_HOST=matlab
      - MATLAB_HTTP_PORT=9090
      - VMH_UPDATE_TMPDIR=/matlab/exchange/vmh_updates
      - VMH_MYSQL_HOST=${VMH_MYSQL_HOST}
      - VMH_MYSQL_PORT=${VMH_MYSQL_PORT}
      - VMH_MYSQL_DATABASE=${VMH_MYSQL_DATABASE}
      - VMH_MYSQL_USER=${VMH_MYSQL_USER}
      - VMH_MYSQL_PASSWORD=${VMH_MYSQL_PASSWORD}
    volumes:
      - ./curationTool/media:/app/curationTool/media
      - staticfiles:/app/curationTool/staticfiles
      - ./curationTool:/app/curationTool
      - matlab_exchange:/matlab/exchange

  db:
    cgroup_parent: reconstructor.slice
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"  # Expose port for host network access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data

  matlab:
    cgroup_parent: reconstructor.slice
    build:
      context: .
      dockerfile: docker/matlab/Dockerfile
      additional_contexts:
        vmh_db_update_source: ../vmh_revamped/vmh_db_update
    mem_limit: 2g
    env_file:
      - .env
    environment:
      - MLM_LICENSE_FILE=${MLM_LICENSE_FILE}
      - MATLAB_HTTP_PORT=9090
      # Override paths for MATLAB container (COBRA and VMH installed in image)
      - COBRA_PATH=/matlab/toolboxes/cobratoolbox
      - SCRIPT_DIRECTORIES=/matlab/scripts,/matlab/toolboxes/vmh_revamped/vmh_db_update/src,/matlab/toolboxes/cobratoolbox/src/dataIntegration/metaboAnnotator/buildMetStruct,/matlab/toolboxes/cobratoolbox
      - VMH_UPDATE_TMPDIR=/matlab/exchange/vmh_updates
      - VMH_MYSQL_HOST=${VMH_MYSQL_HOST}
      - VMH_MYSQL_PORT=${VMH_MYSQL_PORT}
      - VMH_MYSQL_DATABASE=${VMH_MYSQL_DATABASE}
      - VMH_MYSQL_USER=${VMH_MYSQL_USER}
      - VMH_MYSQL_PASSWORD=${VMH_MYSQL_PASSWORD}
    # Use host network to ensure consistent MAC address for licensing
    network_mode: "host"
    volumes:
      # Mount your MATLAB scripts (writable so MATLAB can create data directories)
      - ./matlab_scripts:/matlab/scripts
      # Keep the VMH update toolbox live so MATLAB sees new/changed .m files.
      - ../vmh_revamped/vmh_db_update:/matlab/toolboxes/vmh_revamped/vmh_db_update:ro
      # Shared exchange directory for constructor-generated JSON files.
      - matlab_exchange:/matlab/exchange
      # Mount license file
      - ./licenses:/licenses:ro
      # Note: COBRA Toolbox is installed in the image.
      # Writable directory for MATLAB to create temporary data files
      - matlab_data:/matlab/data
    shm_size: 512M
    # Restart on failure but not on manual stop or successful exit
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/health || exit 1"]
      interval: 4500s
      timeout: 10s
      retries: 3
      start_period: 240s

volumes:
  staticfiles:
  matlab_data:
  matlab_exchange:
  
